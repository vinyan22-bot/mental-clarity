<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Clarity Guide — Stop the Brain Fog | Vinyan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a0f1c; --navy:#0f1729; --navy-soft:#16213a;
    --gold:#c9a227; --gold-light:#e8c766;
    --paper:#f4f0e6; --ink-soft:#9aa5bd; --line: rgba(201,162,39,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--navy-deep); color:var(--paper); font-family:'Inter',sans-serif; overflow-x:hidden; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.08em; text-transform:uppercase;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  :focus-visible{outline:2px solid var(--gold-light); outline-offset:3px;}

  #rippleCanvas{position:absolute; inset:0; width:100%; height:100%; opacity:0.5;}
  .hero{position:relative; min-height:96vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:120px 24px 80px; background:radial-gradient(ellipse at 50% 0%, #131c30 0%, var(--navy-deep) 65%); overflow:hidden;}
  .hero-mark{z-index:2; margin-bottom:22px; overflow:visible; animation:markGlow 3.2s ease-in-out infinite;}
  .hero-mark .mark-ring{transform-origin:60px 60px; animation:markSpin 16s linear infinite;}
  .hero-mark .mark-ring-2{animation-duration:10s; animation-direction:reverse;}
  .hero-mark .mark-breath{animation:markBreathe 3s ease-in-out infinite;}
  .hero-mark .mark-moon{animation:markPulse 3.2s ease-in-out infinite;}
  .hero-mark .mark-star{animation:markTwinkle 2.2s ease-in-out infinite;}
  @keyframes markSpin{ to{ transform:rotate(360deg); } }
  @keyframes markBreathe{ 0%,100%{opacity:0.5; stroke-width:1.2;} 50%{opacity:1; stroke-width:1.8;} }
  @keyframes markGlow{ 0%,100%{ filter:drop-shadow(0 0 4px rgba(201,162,39,0.25)); } 50%{ filter:drop-shadow(0 0 16px rgba(201,162,39,0.65)); } }
  @keyframes markPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  @keyframes markTwinkle{ 0%,100%{ opacity:0.3; transform:scale(0.7); } 50%{ opacity:1; transform:scale(1.2); } }
  .badge{display:inline-flex; align-items:center; gap:10px; font-size:12px; color:var(--gold-light);
    border:1px solid var(--line); border-radius:100px; padding:8px 18px; margin-bottom:28px; background:rgba(201,162,39,0.06); z-index:2;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--gold); box-shadow:0 0 8px var(--gold); animation:dotPulse 1.6s ease-in-out infinite;}
  @keyframes dotPulse{ 0%,100%{ transform:scale(1); box-shadow:0 0 6px var(--gold); } 50%{ transform:scale(1.5); box-shadow:0 0 14px var(--gold-light); } }
  .hero h1{font-size:clamp(32px, 5.4vw, 60px); line-height:1.08; max-width:880px; z-index:2; color:#fbf9f4;}
  .hero h1 em{font-style:italic; color:var(--gold-light);}
  .hero p.sub{max-width:600px; margin:24px auto 0; color:var(--ink-soft); font-size:17px; line-height:1.6; z-index:2;}
  .hero-ctas{z-index:2; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:36px;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:15px; padding:16px 28px; border-radius:8px;
    border:none; cursor:pointer; transition:transform .25s ease, box-shadow .25s ease;}
  .btn-gold{background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:#1a1406; box-shadow:0 8px 30px rgba(201,162,39,0.25);
    position:relative; overflow:hidden;}
  .btn-gold::after{content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg); animation:btnShimmer 3.4s ease-in-out infinite;}
  @keyframes btnShimmer{ 0%{ left:-60%; } 45%{ left:130%; } 100%{ left:130%; } }
  .btn-gold:hover{transform:translateY(-2px); box-shadow:0 12px 40px rgba(201,162,39,0.4);}
  .btn-outline{background:transparent; color:var(--gold-light); border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--gold); transform:translateY(-2px);}
  .hero-value{z-index:2; font-size:11px; color:var(--gold); margin-top:18px; letter-spacing:0.1em;}
  .cd-label{z-index:2; font-size:10px; color:var(--ink-soft); margin-top:18px; letter-spacing:0.08em;}
  .countdown{z-index:2; display:flex; gap:12px; margin-top:10px;}
  .countdown .cd-box{background:var(--navy-soft); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:58px; text-align:center;}
  .countdown .cd-n{font-family:'Fraunces',serif; font-size:22px; color:var(--gold-light); line-height:1;}
  .countdown .cd-l{font-size:9px; color:var(--ink-soft); margin-top:3px; letter-spacing:0.06em;}
  .trust-row{z-index:2; display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin-top:22px; font-size:12px; color:var(--ink-soft);}
  .hero-note{margin-top:16px; font-size:12px; color:#66708a; z-index:2;}
  .hero-note a{color:var(--gold-light); border-bottom:1px solid var(--line);}
  .trust-note{max-width:680px; margin:0 auto; text-align:center; font-size:14px; color:var(--ink-soft); line-height:1.7;
    border:1px solid var(--line); border-radius:14px; padding:28px 32px; background:rgba(201,162,39,0.04);}
  .indiv-compact{padding:22px 18px;}
  .indiv-compact .indiv-icon{width:56px; height:56px; margin-bottom:12px;}
  .indiv-compact h3{font-size:14px; min-height:auto;}
  .indiv-compact p{font-size:11.5px; min-height:auto; margin-bottom:12px;}
  .indiv-compact .indiv-price{font-size:20px;}
  .indiv-compact .indiv-cta{font-size:12px; padding:10px 14px;}

  /* sticky mobile bar */
  .sticky-bar{position:fixed; bottom:0; left:0; right:0; z-index:60; background:rgba(10,15,28,0.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px;
    transform:translateY(120%); transition:transform .35s ease;}
  .sticky-bar.show{transform:translateY(0);}
  .sticky-bar .sb-text{font-size:12.5px; color:var(--paper);}
  .sticky-bar .sb-text b{color:var(--gold-light); font-family:'Fraunces',serif; font-size:16px; display:block;}
  .sticky-bar .btn{padding:12px 20px; font-size:13px; white-space:nowrap;}

  /* floating free-sample button */
  .fab{position:fixed; right:22px; bottom:90px; z-index:70; width:60px; height:60px; border-radius:50%;
    background:linear-gradient(160deg, var(--gold-light), var(--gold)); border:none; cursor:pointer;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 10px 30px rgba(201,162,39,0.4); opacity:0; transform:scale(0.7);
    transition:opacity .35s ease, transform .35s ease, bottom .3s ease;}
  .fab.show{display:flex; opacity:1; transform:scale(1);}
  .fab.lifted{bottom:150px;}
  .fab::before{content:''; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid var(--gold-light);
    opacity:0.5; animation:fabPulse 2.4s ease-out infinite;}
  @keyframes fabPulse{ 0%{ transform:scale(0.9); opacity:0.6; } 100%{ transform:scale(1.35); opacity:0; } }
  .fab svg{width:22px; height:22px; margin-bottom:1px;}
  .fab span{font-size:7.5px; color:#1a1406; font-weight:700; letter-spacing:0.02em; line-height:1.1;}
  @media (max-width:640px){ .fab{width:54px; height:54px; right:16px; bottom:82px;} .fab.lifted{bottom:140px;} }

  /* free sample popup */
  .sample-popup{position:fixed; inset:0; z-index:110; background:rgba(6,9,18,0.85); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px;}
  .sample-popup.show{display:flex;}
  .sample-card{position:relative; max-width:420px; width:100%; background:linear-gradient(165deg, #182236, #0f1729);
    border:1px solid var(--gold); border-radius:16px; padding:40px 32px 32px; text-align:center;
    box-shadow:0 40px 90px rgba(0,0,0,0.6); animation:sampleIn .4s cubic-bezier(.2,.8,.2,1);}
  @keyframes sampleIn{ from{ opacity:0; transform:translateY(18px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .sample-close{position:absolute; top:14px; right:16px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:rgba(255,255,255,0.04); color:var(--ink-soft); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .sample-close:hover{border-color:var(--gold); color:var(--gold-light);}
  .sample-icon{width:64px; height:64px; margin:0 auto 18px;}
  .sample-card .tag{font-size:10.5px; color:var(--gold); letter-spacing:0.1em; margin-bottom:10px;}
  .sample-card h3{font-family:'Fraunces',serif; font-size:24px; color:#fbf9f4; line-height:1.25; margin-bottom:12px;}
  .sample-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:22px;}
  .sample-card .btn{width:100%; justify-content:center; margin-bottom:12px;}
  .sample-fine{font-size:10.5px; color:#5a6178;}

  .section{padding:96px 24px;}
  .section.dark2{background:var(--navy);}
  .eyebrow{color:var(--gold); font-size:12px; margin-bottom:14px; display:block;}
  .center{text-align:center;}
  .section h2{font-size:clamp(26px,4vw,40px); margin-bottom:10px;}
  .section .lede{color:var(--ink-soft); max-width:600px; margin:0 auto 50px; font-size:15px; line-height:1.6;}

  /* stack */
  .stack-section{padding:110px 24px; text-align:center; perspective:1400px;}
  .stack{position:relative; max-width:780px; margin:64px auto 0; height:460px;}
  .card{position:absolute; left:50%; top:50%; width:min(70vw,290px); aspect-ratio:520/673; border-radius:12px;
    overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,0.5); border:1px solid var(--line);
    text-align:left; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.8,.2,1);}
  .card .cover-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .card .card-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,15,28,0) 42%, rgba(6,9,18,0.94) 100%);}
  .card .card-text{position:absolute; left:0; right:0; bottom:0; padding:16px 18px; z-index:2;}
  .card .tag{font-size:9.5px; color:var(--gold); margin-bottom:5px; display:block;}
  .card h3{font-size:15px; color:#fbf9f4; margin-bottom:4px; line-height:1.25;}
  .card p{font-size:11px; color:var(--ink-soft); line-height:1.4;}
  .card .val{position:absolute; top:12px; right:14px; font-family:'Fraunces',serif; color:var(--gold-light); font-size:13px; z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.7);}

  /* bonus grid */
  .bonus-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px; max-width:960px; margin:0 auto;}
  .bonus-card{border:1px solid var(--line); border-radius:12px; padding:24px; background:var(--navy-soft);}
  .bonus-card .icon{font-size:22px; margin-bottom:12px;}
  .bonus-card h3{font-size:16px; color:#fbf9f4; margin-bottom:8px;}
  .bonus-card p{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .bonus-card .pp{margin-top:10px; font-size:11px; color:var(--gold);}

  /* trackers strip */
  .tracker-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:18px; max-width:800px; margin:0 auto;}
  .tracker-thumb{border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; background:var(--navy-soft);
    transition:transform .3s ease, border-color .3s ease;}
  .tracker-thumb:hover{transform:translateY(-4px); border-color:var(--gold);}
  .tracker-thumb img{width:100%; height:180px; object-fit:cover; object-position:top; display:block;}
  .tracker-label{display:block; padding:10px 12px; font-size:11.5px; color:var(--ink-soft);}

  /* lightbox */
  .lightbox{position:fixed; inset:0; z-index:100; background:rgba(6,9,18,0.94); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:40px 20px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:min(90vw,560px); max-height:82vh; border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,0.6); border:1px solid var(--line);}
  .lb-close{position:absolute; top:22px; right:26px; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:rgba(255,255,255,0.04); color:var(--paper); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .lb-close:hover{border-color:var(--gold);}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%;
    border:1px solid var(--line); background:rgba(255,255,255,0.04); color:var(--paper); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;}
  .lb-nav:hover{border-color:var(--gold); color:var(--gold-light);}
  .lb-prev{left:20px;}
  .lb-next{right:20px;}
  .lb-caption{position:absolute; bottom:26px; left:0; right:0; text-align:center; font-size:12.5px; color:var(--ink-soft); mono; letter-spacing:0.04em;}
  @media (max-width:640px){ .lb-nav{width:38px; height:38px; font-size:16px;} .lb-close{width:36px; height:36px; top:14px; right:14px;} }

  /* license cards */
  .license-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; max-width:980px; margin:0 auto; align-items:stretch;}
  @media (max-width:760px){ .license-grid{grid-template-columns:1fr;} }
  .license-card{border:1px solid var(--line); border-radius:16px; padding:38px 34px; background:var(--navy-soft); display:flex; flex-direction:column;}
  .license-card.featured{border-color:var(--gold); background:linear-gradient(160deg, #1a2438, #10182a); position:relative;
    animation:cardGlow 3s ease-in-out infinite;}
  @keyframes cardGlow{ 0%,100%{ box-shadow:0 0 0 rgba(201,162,39,0); } 50%{ box-shadow:0 0 28px rgba(201,162,39,0.22); } }
  .license-card.featured::before{content:'MOST POPULAR'; position:absolute; top:-12px; left:34px; background:var(--gold);
    color:#1a1406; font-size:10px; font-weight:700; letter-spacing:0.08em; padding:5px 12px; border-radius:100px;}
  .license-card .ltag{font-size:12px; color:var(--gold); margin-bottom:10px;}
  .license-card h3{font-size:24px; color:#fbf9f4; margin-bottom:6px;}
  .license-card .lprice{font-family:'Fraunces',serif; font-size:38px; color:var(--gold-light); margin:14px 0 4px;}
  .license-card .lprice span{font-size:14px; color:var(--ink-soft); font-family:'Inter',sans-serif;}
  .license-card .ldesc{font-size:13.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.6;}
  .license-list{list-style:none; margin-bottom:24px; flex-grow:1;}
  .license-list li{font-size:13.5px; color:#d8dae6; padding:8px 0; padding-left:22px; position:relative; border-bottom:1px solid var(--line);}
  .license-list li:last-child{border-bottom:none;}
  .license-list li::before{content:'\2713'; position:absolute; left:0; color:var(--gold); font-weight:700;}
  .license-card .btn{width:100%; justify-content:center;}
  .switch-note{font-size:12px; color:#6f7994; text-align:center; margin-top:14px;}
  .switch-note a{color:var(--gold-light); border-bottom:1px solid var(--line);}
  .card-value{font-size:12px; color:var(--gold); text-align:center; margin-bottom:12px; letter-spacing:0.05em;}
  .card-value .strike{color:#6f7994;}

  .license-trust{max-width:980px; margin:48px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch;}
  @media (max-width:760px){ .license-trust{grid-template-columns:1fr;} }
  .lt-quotes{display:flex; flex-direction:column; gap:14px;}
  .lt-quote{border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:var(--navy-soft);}
  .lt-quote p{font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:#e6e3d8; line-height:1.5;}
  .lt-quote span{display:block; margin-top:8px; font-size:10.5px; color:var(--ink-soft);}
  .lt-guarantee{border:1px solid var(--line); border-radius:12px; padding:22px; background:radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.08), transparent 70%);
    display:flex; align-items:center; gap:16px;}
  .lt-seal{flex-shrink:0; width:46px; height:46px; border-radius:50%; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:13px; color:var(--gold-light);}
  .lt-guarantee p{font-size:12.5px; color:var(--ink-soft); line-height:1.55;}
  .lt-guarantee p b{color:var(--paper);}

  /* why grid */
  /* individual products */
  .indiv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px; max-width:1000px; margin:0 auto;}
  .indiv-card{border:1px solid var(--line); border-radius:14px; padding:30px 24px; background:linear-gradient(160deg, #182236, #10182a);
    text-align:center; display:flex; flex-direction:column; align-items:center; transition:transform .3s ease, border-color .3s ease;}
  .indiv-card:hover{transform:translateY(-4px); border-color:var(--gold);}
  .indiv-icon{width:88px; height:88px; margin-bottom:18px; animation:iconFloat 3.6s ease-in-out infinite;}
  @keyframes iconFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-8px) rotate(3deg); } }
  .indiv-card h3{font-size:16px; color:#fbf9f4; margin-bottom:6px; min-height:40px;}
  .indiv-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:16px; min-height:56px;}
  .indiv-price{font-family:'Fraunces',serif; font-size:26px; color:var(--gold-light); margin-bottom:4px;}
  .indiv-included{font-size:10.5px; color:var(--gold); margin-bottom:16px; letter-spacing:0.02em;}
  .indiv-cta{width:100%; justify-content:center; font-size:13px; padding:12px 18px;}
  .indiv-note{max-width:600px; margin:0 auto 46px; text-align:center; font-size:13.5px; color:var(--ink-soft);}
  .indiv-note b{color:var(--gold-light);}

  .why-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:24px; max-width:960px; margin:0 auto;}
  .why-card{border:1px solid var(--line); border-radius:12px; padding:26px; background:var(--navy-soft);}
  .why-card .num{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:12px; margin-bottom:12px;}
  .why-card h3{font-size:16px; color:#fbf9f4; margin-bottom:8px;}
  .why-card p{font-size:13px; color:var(--ink-soft); line-height:1.6;}

  /* pattern cards */
  .pattern-note{max-width:620px; margin:0 auto 34px; text-align:center; font-size:12.5px; color:#6f7994;
    border:1px dashed var(--line); padding:12px 16px; border-radius:8px;}
  .pattern-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:22px; max-width:900px; margin:0 auto;}
  .pattern-card{background:var(--navy-soft); border:1px solid var(--line); border-radius:12px; padding:24px;}
  .pattern-card .q{font-family:'Fraunces',serif; font-style:italic; font-size:16px; color:#e6e3d8; line-height:1.5;}
  .pattern-card .who{margin-top:12px; font-size:11px; color:var(--ink-soft);}

  /* guarantee */
  .guarantee{max-width:640px; margin:0 auto; text-align:center; border:1px solid var(--line); border-radius:16px; padding:44px 32px;
    background:radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.08), transparent 70%);}
  .guarantee .seal{width:64px; height:64px; border-radius:50%; border:1px solid var(--gold); display:flex; align-items:center;
    justify-content:center; margin:0 auto 18px; font-family:'Fraunces',serif; font-size:20px; color:var(--gold-light);}
  .guarantee h3{font-size:21px; margin-bottom:12px;}
  .guarantee p{color:var(--ink-soft); font-size:14px; line-height:1.7;}

  /* faq tabs */
  .faq-tabs{display:flex; gap:10px; justify-content:center; margin-bot
